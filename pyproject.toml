[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-prediction"
version = "1.0.0"
description = "Shadow-first multi-sport prediction and market-error research with gated Polymarket US execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
model-prediction = "model_prediction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["model_prediction"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
