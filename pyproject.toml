[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-prediction"
version = "1.0.0"
description = "Shadow-first multi-sport prediction and market-error research with gated Polymarket US execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "duckdb>=1.5,<2",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "polars>=1.40,<2",
  "pybaseball>=2.2,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<6",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "xgboost>=3.2,<3.3; python_version < '3.12'",
  "xgboost>=3.4,<4; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "scipy-stubs",
  "types-PyYAML",
  "pandas-stubs",
  "types-openpyxl",
]

[project.scripts]
model-prediction = "model_prediction.cli:main"
rebuild-shadow = "model_prediction.rebuild.cli:main"
rebuild-data = "model_prediction.rebuild.data_cli:main"
rebuild-model = "model_prediction.rebuild.model_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.14"
packages = ["model_prediction"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
