[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-prediction"
version = "1.0.0"
description = "Shadow-first multi-sport prediction and market-error research with gated Polymarket US execution"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cryptography>=43,<47",
  "duckdb>=1.5,<2",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pandera>=0.20,<1",
  "polars>=1.40,<2",
  "pyarrow>=25,<26",
  "pybaseball>=2.2,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<6",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "xgboost>=3.4,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "scipy-stubs",
  "types-PyYAML",
  "pandas-stubs",
  "types-openpyxl",
]
optimization = [
  "optuna>=4,<5",
]

[project.scripts]
model-prediction = "model_prediction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.mypy]
python_version = "3.14"
packages = ["model_prediction"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
