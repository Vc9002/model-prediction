name: rebuild-provider-health

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wnba-public-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install provider test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run tiny opt-in live contract check
        env:
          PYTHONPATH: src:.
          REBUILD_LIVE_API_TESTS: "1"
        run: python -m pytest -q tests/rebuild/test_live_provider_health.py
