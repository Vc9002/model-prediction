name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/
      - name: Mypy
        # Non-blocking: 112 pre-existing errors as of 2026-08-06 (see
        # outputs/rebuild/takeover_status.md), mostly in the legacy cli.py.
        # Surface new errors without gating on paying down the baseline.
        continue-on-error: true
        run: mypy src/model_prediction
      - name: Tests
        run: PYTHONPATH=src:. python -m pytest tests/ -q
