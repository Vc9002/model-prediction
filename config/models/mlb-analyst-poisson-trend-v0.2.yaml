away_field_run_factor: 1.0
# Renamed/completed to match the factors current estimate_runs()/_offense_index()/
# _starter_weakness() in models/mlb.py actually clip (bullpen_weakness, park,
# weather, offense, starter_weakness) -- the prior keys (bullpen_fatigue,
# park_factor, temperature, wind_speed) don't match any current code path.
# park is a direct carry-over of the old park_factor range (same concept,
# same real park-factor scale, Coors ~1.12 to Seattle ~0.92 per data/features/
# park_factors.py). weather bounds a single combined multiplicative run
# factor (features/weather.py's run_factor_from_conditions), not separate
# temperature/wind inputs, so it can't reuse the old temperature/wind_speed
# ranges directly -- reasoned as a modest +/-15-20% swing, the largest real
# weather effects (e.g. wind at Wrigley) being outliers, not the norm.
# offense/starter_weakness/bullpen_weakness are all ratios centered on 1.0
# (value / league-average value); reasoned bounds allow real best-to-worst
# spread without permitting runaway multiplicative outliers. Same caveat as
# the simulation block below: a documented starting calibration, not fit
# against this project's own historical data.
factor_bounds:
  bullpen_weakness:
  - 0.5
  - 2.0
  park:
  - 0.8
  - 1.3
  weather:
  - 0.85
  - 1.2
  offense:
  - 0.7
  - 1.4
  starter_weakness:
  - 0.5
  - 2.0
feature_schema_version: v3
formula_version: mlb-analyst-poisson-trend-v0.2
# Elasticities on each run-scaling factor below (offense, opposing starter
# weakness, opposing bullpen weakness, park, weather) -- added 2026-07-30.
# Previously every factor implicitly had exponent 1.0 (assumed to move the
# run estimate exactly proportionally); a real Poisson GLM fit against 629
# real games (2024-02..2026-07, reconstructed_features against real box
# scores -- far more than the 2026-07-29 backtest's 162-game/12-day window)
# showed every one of them is real but much weaker than 1.0 in practice.
# Fit via chronological expanding-window cross-validation (4 folds); alpha
# 0.05 L2 regularization chosen as a middle ground across the tested range
# (0, 0.02, 0.05, 0.1), since fold-to-fold performance was similar across
# that range and this sits in the middle rather than at either boundary.
# bullpen_elasticity's raw fit was consistently NEGATIVE across every alpha
# and every fold's point estimate (worse opposing bullpen -> fewer runs
# allowed) -- baseball-implausible given how the feature is defined higher
# is supposed to mean weaker/more runs-prone), most likely selection bias in
# which relief innings get recorded (a leading team's best reliever closes
# it out; a trailing team's mop-up arm eats innings), not a real causal
# effect. Clipped to 0.0 rather than trusted -- confirmed dropping the
# feature entirely gives statistically indistinguishable holdout
# correlation from including it at its negative fit, so 0.0 costs nothing
# real. Re-fit periodically alongside the other season-dependent baselines
# (see mlb_baseline_refresh.py) once more real relief-appearance data
# accumulates enough to test whether the selection-bias explanation holds.
offense_elasticity: 0.5
starter_weakness_elasticity: 0.5
bullpen_elasticity: 0.0
park_elasticity: 0.5
weather_elasticity: 0.3
home_field_run_factor: 1.04
league_runs_per_team_game: 4.5493
league_starter_era: 4.1958
league_strikeout_rate: 0.2193
league_walk_rate: 0.0785
recent_half_life_games: 10.0
recent_prior_strength_games: 12.0
# Shrinkage strength for the starter's recent (last-5-start) ERA before it
# enters the season/recent blend below -- mirrors recent_prior_strength_games
# for team offense, but in innings-pitched rather than games (ERA's natural
# sample-size unit). 20 IP means a starter needs roughly a full turn through
# the rotation before their recent-form number gets close to full trust
# relative to their season ERA; below that, season_era dominates. Added
# 2026-07-29 after a real 162-game backtest showed starter_weakness pinned
# against its factor_bounds clip on a meaningful share of real games without
# this -- reasoned from standard ERA-stabilization heuristics (meaningful
# reliability needs well over 20 IP on its own), not itself precision-fit.
starter_recent_prior_innings: 20.0
# Same shrinkage treatment for season_era itself, toward league_starter_era
# rather than toward season_era (there's nothing more stable to shrink
# toward for the season number). A higher prior than the recent-form one
# above since season ERA is trusted more readily once there's a real sample
# -- but a starter with only a handful of innings this season (early callup,
# return from injury) still needs heavy regression toward league average, not
# their own single-outing ERA at full confidence. 40 IP means real signal
# roughly balances the league prior at that point. Reasoned from standard
# ERA-stabilization heuristics, not itself precision-fit.
starter_season_prior_innings: 40.0
# Shrinkage strength for the K%/BB% "discipline" adjustment, in batters
# faced (that rate's own natural sample-size unit) -- same treatment as the
# two ERA priors above, applied 2026-07-29 in the same pass. 60 batters
# faced is roughly two real starts' worth of the last-5-start window this
# rate is computed over.
starter_rate_prior_batters_faced: 60.0
seed_method: stable_hash
# Gamma-Poisson mixture variance decomposition, restoring fields the
# 2026-07-20 sync accidentally dropped (see git history: this file never
# carried them, but simulate_game() in models/mlb.py has always required
# them). Values are reasoned, not fit from this project's own historical
# data: real MLB team runs-per-game has mean ~4.5 (matches
# league_runs_per_team_game above) with a variance well above the pure-
# Poisson value of 4.5 (empirically closer to 7-9), so total excess
# variance / mean^2 implies a combined dispersion parameter around 0.15-0.2.
# Split unevenly between a shared (park/weather/umpire, affects both teams
# equally) and team-specific (that day's starter/bullpen/lineup) component,
# weighting team-specific higher since day-to-day team form varies more
# than shared park/weather conditions. Treat as a documented starting
# calibration to refine against real historical run variance, not a
# precision-fit value.
simulation:
  simulations: 20000
  seed: 42
  shared_environment_variance: 0.06
  team_specific_variance: 0.12
  extra_inning_home_probability_bounds:
  - 0.50
  - 0.55
starter_recent_weight: 0.7
starter_season_weight: 0.3
strikeout_weight: 0.15
# Same situation as factor_bounds: the old market/model keys don't match
# any current code path. _uncertainty_components() combines these in
# quadrature (sqrt of sum of squares) per active condition, then clips to
# [minimum, maximum] -- so components are fractional-probability
# contributions, not independent additive percentages. base/model_form/
# pitcher are always active; the rest add only when that specific input is
# degraded (rookie starter, missing bullpen/weather/lineup/xFIP/wRC+ data).
# Reasoned to keep the always-on floor near the file's old 0.005-0.01 scale
# and degraded-input penalties larger, capped so total uncertainty can't
# collapse to false precision (minimum) or explode past a sane bound
# (maximum). Documented starting calibration, not historically fit.
uncertainty:
  base: 0.02
  model_form: 0.01
  pitcher: 0.015
  rookie_starter: 0.03
  bullpen_unavailable: 0.02
  weather_unavailable: 0.01
  lineup_projected: 0.015
  lineup_unavailable: 0.025
  missing_xfip: 0.01
  missing_wrc_plus: 0.01
  minimum: 0.02
  maximum: 0.15
walk_weight: 0.1
