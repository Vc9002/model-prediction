schema_version: "3"

prediction_service:
  enabled: true
  mode: production

  primary:
    sport: WNBA
    market: moneyline
    model_id: wnba-elo-trend-lr-v4

  # The registry (src/model_prediction/production_registry.py) is the single
  # source of truth for production. Every entry below is validated at
  # startup; a model whose contract cannot resolve is failed closed
  # (load_error, resolution refused) — never silently served. The primary's
  # failure is a hard config error.
  models:
    - model_id: wnba-elo-trend-lr-v4
      sport: WNBA
      market: moneyline
      implementation: json_artifact
      artifact: config/models/wnba-elo-trend-lr-v4.json
      enabled: true
      rollback_model: null
    - model_id: wnba-spread-margin-v1
      sport: WNBA
      market: spread
      implementation: json_artifact
      artifact: config/models/wnba-spread-margin-v1.json
      enabled: true
      rollback_model: null
    - model_id: wnba-total-margin-v1
      sport: WNBA
      market: total
      implementation: json_artifact
      artifact: config/models/wnba-total-margin-v1.json
      enabled: true
      rollback_model: null
    - model_id: mlb-elo-trend-lr-v8
      sport: MLB
      market: moneyline
      implementation: json_artifact
      artifact: config/models/mlb-elo-trend-lr-v8.json
      enabled: true
      rollback_model: mlb-elo-trend-lr-v7
    - model_id: measured-edge-margin-v3
      sport: MLB
      market: spread
      implementation: json_artifact
      artifact: config/models/measured-edge-margin-v3.json
      enabled: true
      rollback_model: null
    - model_id: measured-edge-totals-v3
      sport: MLB
      market: total
      implementation: json_artifact
      artifact: config/models/measured-edge-totals-v3.json
      enabled: true
      rollback_model: null
    - model_id: mlb-nrfi-v1
      sport: MLB
      market: nrfi
      implementation: json_artifact
      artifact: config/models/mlb-nrfi-v1.json
      enabled: true
      rollback_model: null
    - model_id: nba-elo-trend-lr-v4
      sport: NBA
      market: moneyline
      implementation: json_artifact
      artifact: config/models/nba-elo-trend-lr-v4.json
      enabled: true
      rollback_model: null
    - model_id: nfl-elo-trend-lr-v4
      sport: NFL
      market: moneyline
      implementation: json_artifact
      artifact: config/models/nfl-elo-trend-lr-v4.json
      enabled: true
      rollback_model: null
    - model_id: soccer-poisson-dc-v1
      sport: SOCCER
      market: moneyline
      implementation: code_backed_model
      entry: model_prediction.models.soccer:soccer_model
      enabled: true
      rollback_model: null
    - model_id: tennis-surface-elo-v1
      sport: TENNIS
      market: moneyline
      implementation: code_backed_model
      entry: model_prediction.models.tennis:tennis_model
      enabled: true
      rollback_model: null
    - model_id: cs2-tiered-elo-v6
      sport: CS2
      market: moneyline
      implementation: json_artifact
      artifact: config/models/cs2-tiered-elo-v6.json
      enabled: true
      rollback_model: null
    - model_id: dota2-tiered-elo-v6
      sport: DOTA2
      market: moneyline
      implementation: json_artifact
      artifact: config/models/dota2-tiered-elo-v6.json
      enabled: true
      rollback_model: null
    - model_id: lol-tiered-elo-v6
      sport: LOL
      market: moneyline
      implementation: json_artifact
      artifact: config/models/lol-tiered-elo-v6.json
      enabled: true
      rollback_model: null
    - model_id: valorant-tiered-elo-v6
      sport: VALORANT
      market: moneyline
      implementation: json_artifact
      artifact: config/models/valorant-tiered-elo-v6.json
      enabled: true
      rollback_model: null
    - model_id: rainbow_six-tiered-elo-v6
      sport: RAINBOW_SIX
      market: moneyline
      implementation: json_artifact
      artifact: config/models/rainbow_six-tiered-elo-v6.json
      enabled: true
      rollback_model: null
    - model_id: kbo-tie-aware-elo-v2
      sport: KBO
      market: moneyline
      implementation: json_artifact
      artifact: config/models/kbo-tie-aware-elo-v2.json
      enabled: true
      rollback_model: null
    - model_id: npb-tie-aware-elo-v2
      sport: NPB
      market: moneyline
      implementation: json_artifact
      artifact: config/models/npb-tie-aware-elo-v2.json
      enabled: true
      rollback_model: null

  # sport -> market -> champion model_id. The champion is what SERVES a
  # sport/market; the primary above is what the canary predict cycle runs.
  # Promotion/rollback (model_promotion.py) mutate these pointers
  # atomically and record every change.
  champions:
    WNBA:
      moneyline: wnba-elo-trend-lr-v4
      spread: wnba-spread-margin-v1
      total: wnba-total-margin-v1
    MLB:
      moneyline: mlb-elo-trend-lr-v8
      spread: measured-edge-margin-v3
      total: measured-edge-totals-v3
      nrfi: mlb-nrfi-v1
    NBA:
      moneyline: nba-elo-trend-lr-v4
    NFL:
      moneyline: nfl-elo-trend-lr-v4
    SOCCER:
      moneyline: soccer-poisson-dc-v1
    TENNIS:
      moneyline: tennis-surface-elo-v1
    CS2:
      moneyline: cs2-tiered-elo-v6
    DOTA2:
      moneyline: dota2-tiered-elo-v6
    LOL:
      moneyline: lol-tiered-elo-v6
    VALORANT:
      moneyline: valorant-tiered-elo-v6
    RAINBOW_SIX:
      moneyline: rainbow_six-tiered-elo-v6
    KBO:
      moneyline: kbo-tie-aware-elo-v2
    NPB:
      moneyline: npb-tie-aware-elo-v2

  # Kept alongside `models` for backward compatibility with the legacy
  # validator contract and champion_challenger.freeze(), which still reads
  # these two sections directly. The registry derives from `models` when
  # present; legacy v1/v2 configs derive from these instead.
  allowed_models:
    - wnba-elo-trend-lr-v4
    - wnba-spread-margin-v1
    - wnba-total-margin-v1
    - mlb-elo-trend-lr-v8
    - measured-edge-margin-v3
    - measured-edge-totals-v3
    - mlb-nrfi-v1
    - nba-elo-trend-lr-v4
    - nfl-elo-trend-lr-v4
    - soccer-poisson-dc-v1
    - tennis-surface-elo-v1
    - cs2-tiered-elo-v6
    - dota2-tiered-elo-v6
    - lol-tiered-elo-v6
    - valorant-tiered-elo-v6
    - rainbow_six-tiered-elo-v6
    - kbo-tie-aware-elo-v2
    - npb-tie-aware-elo-v2

  artifact_map:
    wnba-elo-trend-lr-v4: config/models/wnba-elo-trend-lr-v4.json
    wnba-spread-margin-v1: config/models/wnba-spread-margin-v1.json
    wnba-total-margin-v1: config/models/wnba-total-margin-v1.json
    mlb-elo-trend-lr-v8: config/models/mlb-elo-trend-lr-v8.json
    measured-edge-margin-v3: config/models/measured-edge-margin-v3.json
    measured-edge-totals-v3: config/models/measured-edge-totals-v3.json
    mlb-nrfi-v1: config/models/mlb-nrfi-v1.json
    nba-elo-trend-lr-v4: config/models/nba-elo-trend-lr-v4.json
    nfl-elo-trend-lr-v4: config/models/nfl-elo-trend-lr-v4.json
    cs2-tiered-elo-v6: config/models/cs2-tiered-elo-v6.json
    dota2-tiered-elo-v6: config/models/dota2-tiered-elo-v6.json
    lol-tiered-elo-v6: config/models/lol-tiered-elo-v6.json
    valorant-tiered-elo-v6: config/models/valorant-tiered-elo-v6.json
    rainbow_six-tiered-elo-v6: config/models/rainbow_six-tiered-elo-v6.json
    # Artifact files renamed to match the embedded model_version
    # ({league}-tie-aware-elo-v2); they were previously written as
    # ...-v1.json, so these paths never existed and freeze() mislabeled
    # kbo/npb as code-backed (audit 2026-08-13).
    kbo-tie-aware-elo-v2: config/models/kbo-tie-aware-elo-v2.json
    npb-tie-aware-elo-v2: config/models/npb-tie-aware-elo-v2.json

  # Daily still evaluates these workflows for Flat/research evidence, but
  # none has an exact qualified production-serving contract. They must never
  # reach Main, and health remains DEGRADED while they stay active here.
  blocked_workflows: []

  fallback_action: no_prediction

execution:
  automated_orders: false
  manual_orders_only: true

dashboard:
  production_card_enabled: true

scheduler:
  production:
    label: com.modelprediction.production
    interval_seconds: 10800
  rebuild:
    label: com.modelprediction.rebuild-shadow
    interval_seconds: 10800

health:
  max_data_age_minutes: 120
  require_finite_probabilities: true
  require_probability_normalization: true
