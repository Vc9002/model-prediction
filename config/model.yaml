schema_version: '2'
project:
  execution_mode: live_manual
  timezone: UTC
  ledger_path: data/picks.xlsx
  # Re-enabled true 2026-08-13 by explicit operator directive ("unretire
  # main ledger"). data/main had been archived 2026-08-11
  # (data/archive/2026-08-10-main-ledger-archived-shadow-primary/) and the
  # dashboard's primary display switched to the rebuild shadow ledger.
  # With false, cli.py constructs the incumbent Main PickLedger with
  # retired=True (see ledger.py's PickLedger docstring) -- readable but
  # every write silently no-ops instead of recreating data/main/*.xlsx.
  # With true, Main is back in the daily write path; the archived
  # per-sport workbooks were restored to data/main/ on 2026-08-13.
  main_ledger_enabled: true
  audit_path: data/events.jsonl
  polymarket_snapshot_path: data/polymarket_us_snapshots.jsonl
  market_odds_snapshot_path: data/market_odds_snapshots.jsonl
  entity_registry_path: data/entities/teams.json
  ledger_schema_version: '3'
  audit_schema_version: '1'
  entity_map_version: '1'
  maximum_data_age_hours: 12
  maximum_unreviewed_market_disagreement: 0.1
team_ban_list:
  enabled: true
  # Only leagues in the canonical entity registry (MLB/NBA/WNBA/NFL) belong
  # here. Removed 2026-08-02 (review finding, DEBUG.md): TENNIS/LOL/CS2/KBO/
  # NPB stub sections implied ban support that didn't actually work --
  # TeamBanList.check/.add/.remove all resolve through the canonical
  # registry (bans.py), and these sports are deliberately registry-free
  # (name-based placeholder CanonicalTeams; confirmed live that
  # registry.resolve(League.LOL, "T1") raises EntityResolutionError). A
  # real fix would need a genuinely separate, registry-free ban mechanism
  # for these sports; not built, since nothing was ever actually banned in
  # any of them (every section was empty) -- removing the misleading stub
  # is more honest than leaving a config section that silently doesn't do
  # what it looks like it does.
  teams:
    MLB: []
    NBA: []
    WNBA: []
    NFL: []
    NCAAF: []
  allowed_reasons:
  - data_quality
  - injury_uncertainty
  - model_miss_history
  - market_efficiency
  - manual_governance
bankroll:
  unit_value_usd: 5.00
  starting_bankroll_usd: 51.0
  reference_units: 5
  kelly_fraction: 0.5
  min_edge: 0.02
  # Range widened 2026-07-31 (operator directive) from 0.5-2.0 to 1.0-2.0:
  # 1U is now the floor for the LEAST confident logged pick, 2U the ceiling
  # for the most confident -- paired with the same-day fix making
  # model_uncertainty actually shrink sizing within that range (previously
  # a dead parameter in edge_scaled_units).
  min_pick_units: 1.0
  max_pick_units: 2.0
  max_daily_units: 5.0
  max_league_daily_units: 3.0
  max_event_units: 2.0
  max_team_daily_units: 3.0
  unit_increment: 0.25
research_scoring:
  auto_score_on_settlement: true
  default_units: 1.0
  note: fixed one-unit hypothetical scoring; no real exposure or execution
data_sources:
  market:
    primary: polymarket_us
    polymarket_us:
      base_url: https://gateway.polymarket.us
      pricing: executable_ask
    kalshi:
      status: deferred
      reason: requires US residency (CFTC-regulated)
  odds_fallback:
    provider: the_odds_api
    base_url: https://api.the-odds-api.com/v4
    requires: THE_ODDS_API_KEY
    # Superseded 2026-08-26: soccer results now come from api_football
    # (requires API_FOOTBALL_KEY). Nothing reads this block; kept as the
    # documented fallback record.
  sport_data:
    provider: espn_public
    mlb_deep: mlb_statsapi
    tennis_historical: sackmann_csv
    optional_upgrade: sportsdataio
    esports_series:
      provider: bo3_public
      base_url: https://api.bo3.gg/api/v1
      requires_api_key: false
      requires_signup: false
      titles:
      - lol
      - cs2
      status: research_replaceable
      attribution: https://bo3.gg/
      terms: https://bo3.gg/wiki/use-of-services
execution:
  status: live
  allow_manual_research_orders: true
  manual_research_require_active_model: true
  manual_research_require_positive_edge: true
  requirements:
  - explicit user execute command in the current turn
  - --execute CLI flag
  - POLYMARKET_KEY_ID and POLYMARKET_SECRET_KEY environment variables
  - interactive Y/N confirmation of exact order details
  - qualified calls, or an explicit manual override on an active-model positive-edge
    research row
  - unit engine caps still apply
  - audit chain entry for every order
model_iteration_policy:
  status: continuous
  parameter_freezes_allowed: true
  require_versioned_change: true
  require_walk_forward_ablation: true
  require_locked_holdout_before_promotion: true
selection_gate:
  target_called_hit_rate: 0.6
  minimum_locked_holdout_calls: 50
  qualification_metric: locked_holdout_hit_rate
  require_positive_executable_price_ev: false
  roi_role: optional_diagnostic
  brier_role: secondary_reporting
  calibration_role: secondary_reporting
  polymarket_costs_required_for_qualification: false
  missing_artifact_action: no_call
models:
  shared_features:
    trend_analysis:
      enabled: true
      method: exponentially_weighted_opponent_adjusted
      half_lives_games:
      - 3
      - 10
      - 25
      prior_strength_games: 12
      require_ablation_gain: true
  MLB:
    family: elo_trend_logistic_regression
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: 'v8 (2026-08-04): operator-directed promotion
      after a real walk-forward test (same methodology as v7''s own build:
      build_walk_forward_rows + chronological_split, self-consistency-verified
      by first reproducing v7''s exact stored holdout numbers). Replaces
      pitcher_era_gap (team-level rolling runs-allowed) with starter_era_gap
      (real per-starter rolling ERA from mlb_statsapi boxscore history,
      features/starter_history.py -- new live provider + daily capture step
      added same day). qualified=false in the artifact itself: locked-holdout
      alone clears this project''s 60%/50-call bar (60.81% hit rate, 148 calls,
      +23.8u/-110 at the properly validation-learned threshold), but validation
      Brier regressed vs v7''s incumbent feature set (0.24702 vs 0.24655) --
      the same disagreement pattern found testing this feature additively on
      2026-08-02, now confirmed in the replacement form too. Promoted anyway
      by explicit operator directive, not because it cleared the automatic
      promotion bar -- see the artifact''s qualification.validation_regression_note
      and training.promotion_rationale for the full numbers. v7 remains
      available as legacy_research_rollback.'
    active_production_version: mlb-elo-trend-lr-v8
    production_artifact: config/models/mlb-elo-trend-lr-v8.json
    protected_versions:
    - mlb-elo-trend-lr-v8
    active_research_version: spread-baseline-v1
    active_research_name: Spread & Total Baseline
    min_edge: 0.05
    legacy_research_rollback: mlb-elo-trend-lr-v7
    iteration_policy:
      status: continuous
      parameter_freezes_allowed: true
      require_versioned_change: true
      require_walk_forward_ablation: true
      require_locked_holdout_before_promotion: true
      research_outputs_zero_units: true
    problem_cohorts:
      totals:
        status: active_research
        diagnosis: absolute_run_environment_miss
        # P1-17 (2026-08-04): promoted a real Poisson-GLM elasticity refit
        # (mlb-analyst-poisson-trend-v0.3, scripts/mlb_elasticity_refit.py,
        # held-out correlation 0.10-0.16 across 4 chronological folds against
        # 1136 real completed games) replacing v0.2's hand-bumped round-number
        # elasticities. This DID NOT resolve the totals miss: rebuilding
        # measured-edge-totals-v3 against the new formula and the same 284-game
        # diagnostic window shows correlation regressed slightly (0.0585->0.0414)
        # and diagnostic hit rate/units fell (55.3%/+6.82u -> 52.9%/+0.73u).
        # Directly checking the raw model's own selected-side split across the
        # full diagnostic set (not just real, edge-gated logged picks) found it
        # near-balanced in BOTH the old and new formula (~52-53% over either
        # way) -- the previously-reported 71% over-pick figure could not be
        # reproduced at this level, suggesting it reflects a smaller,
        # higher-variance sample of real edge-gated picks rather than a
        # structural property the raw model exhibits across all games. This is
        # consistent with (and sharpens) the diagnosis below: elasticities
        # govern each team's *relative* run differentiation, which helps
        # margin/spread; totals needs the *absolute* run-environment signal
        # this refit was never expected to supply on its own. Margin/spread
        # DID improve, marginally but really: correlation 0.2057->0.208, hit
        # rate 59.5%->60.0%, diagnostic units +39.36->+41.45 (see F-62,
        # MASTER.md). Promoted per explicit operator directive (both markets
        # share one Trend Engine simulation -- there is no way to promote
        # margin's improvement without moving totals onto the same formula).
        experiments_in_order:
        - totals_specific_market_residual
        - branched_absolute_run_intensity_head
        preserve_paired_score_coherence: true
        locked_chronological_test_required: true
        compare_against:
        - measured-edge-v1
        - no_vig_market_probability
    # P0-5 (2026-08-03): these two used to both point at mlb-spread-baseline-v1.json
    # -- an unrelated, unfitted heuristic baseline (elo_margin / league_avg_total)
    # that no code in src/model_prediction ever reads for MLB. MLB's real, live,
    # separately-fitted spread and totals research already exists as its own
    # working pipeline (_forecast_mlb / _forecast_mlb_totals_flat in cli.py) --
    # these keys now point at that pipeline's actual artifacts instead of a
    # mismatched file, so a future consumer of this config key sees MLB's real
    # spread/total model rather than the generic cross-sport baseline.
    # P1-17 (2026-08-04): v2 -> v3, rebuilt against the promoted
    # mlb-analyst-poisson-trend-v0.3 formula (both models share one Trend
    # Engine simulation, so both artifacts move together). See the
    # problem_cohorts.totals note above for the honest totals-specific result.
    spread_research_artifact: config/models/measured-edge-margin-v3.json
    total_research_artifact: config/models/measured-edge-totals-v3.json
  NBA:
    family: elo_trend_normal_approximation
    status: shadow_qualified
    origin: statistical_model
    active_production_version: nba-elo-trend-lr-v4
    production_artifact: config/models/nba-elo-trend-lr-v4.json
    protected_versions:
    - nba-elo-trend-v1
    - nba-elo-trend-lr-v1
    - nba-elo-trend-lr-v3
    # Spread/total baselines for NBA were archived 2026-08-13 (config/models/
    # archive/nba-spread-baseline-v1.json) as obsolete; the dangling research
    # refs were removed with them. Re-add a real artifact when NBA spread/
    # total research resumes.
  WNBA:
    family: elo_trend_normal_approximation
    status: shadow_qualified
    origin: statistical_model
    active_production_version: wnba-elo-trend-lr-v4
    min_edge: 0.05
    production_artifact: config/models/wnba-elo-trend-lr-v4.json
    protected_versions:
    - wnba-elo-trend-v1
    - wnba-elo-trend-lr-v1
    - wnba-elo-trend-lr-v3
    active_research_version: spread-margin-v1
    active_research_name: Spread & Total Baseline
    spread_research_artifact: config/models/wnba-spread-margin-v1.json
    total_research_artifact: config/models/wnba-total-margin-v1.json
    sizing_recommendation: flat_1.5_to_2.0u
    sizing_recommendation_reason: '2026-07-22 analysis: Kelly/edge-scaled sizing underperforms
      flat betting for WNBA due to thin edges. Flat 2.0u produced +2.64u on 13 settled
      picks vs +0.40u ledger P&L. Model is directionally strong (76.9% hit rate) but
      edge magnitudes are small.'
  SOCCER:
    family: poisson_dixon_coles
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: 'Operator directive, 2026-08-02: promote soccer
      into Main+Flat by explicit manual override, not genuine promotion. The
      active soccer-poisson-dc-v1 model has never been run through this
      project''s walk-forward/locked-holdout pipeline (validation.py) --
      no artifact file with a qualified/qualified_for_betting field exists
      for it at all, unlike every other shadow_qualified league. Gated
      Research and Main will now receive real, sized QUALIFIED_SHADOW_CALL
      rows whenever a contract clears min_edge, same criterion as before.
      _row_artifact_qualified (cli.py) fails closed for this override (no
      matchable artifact => False), so PolymarketExecutor.execute still
      refuses real execution on these rows without --manual-research-order
      -- this override changes what gets logged/sized, not what can
      actually be traded unattended.

      Update 2026-08-03: "same criterion as before" above is now stale --
      validation.qualify_soccer_total_model ran for the first time this
      session (chronological 60/20/20 split, confidence threshold learned
      on validation at a 65% target hit rate, graded on a separate locked
      holdout): totals (the market min_edge was actually describing)
      qualified true, 66.7% hit rate on 162 locked-holdout calls,
      +44.2 units at -110, every qualifying month positive. Operator
      approved wiring research_confidence_gate below from that real result.'
    model_type: multinomial_3way
    active_research_version: soccer-poisson-dc-v1
    legacy_binary_research_version: soccer-elo-trend-lr-v2
    legacy_binary_research_artifact: config/models/soccer-elo-trend-lr-v2.json
    min_edge: 0.05
    research_confidence_gate: 0.230157
    leagues:
    - EPL
    - LA_LIGA
    - BUNDESLIGA
    - SERIE_A
    - MLS
    - UCL
    - BRASILEIRAO
    - BRAZIL_SERIE_B
    - ARGENTINA
    - ARGENTINA_2
    - COLOMBIA
    - CHILE
    - URUGUAY
    - ECUADOR
    - PERU
    - SUDAMERICANA
    - FRIENDLIES
    - CLUB_FRIENDLIES
    markets:
    - full_game_total_2_5
  NFL:
    family: elo_trend_normal_approximation
    status: shadow_qualified
    origin: statistical_model
    active_production_version: nfl-elo-trend-lr-v4
    production_artifact: config/models/nfl-elo-trend-lr-v4.json
    # Spread/total baselines for NFL were archived 2026-08-13 (config/models/
    # archive/nfl-spread-baseline-v1.json) as obsolete; the dangling research
    # refs were removed with them. Re-add a real artifact when NFL spread/
    # total research resumes.
  NCAAF:
    family: elo_trend_key_number_engine
    # Demoted 2026-08-30: promoted on a simulated cohort (see production.yaml).
    status: research
    origin: statistical_model
    active_production_version: college-football-v1
    production_artifact: config/models/college-football-v1.json
    markets:
    - moneyline
    - spread
    - total
    min_edge: 0.03
    spread_sd: 15.0
    total_sd: 14.5
    home_field_advantage_points: 3.0
  TENNIS:
    family: surface_blended_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: 'Operator directive, 2026-08-03: promote tennis
      into Main+Flat by explicit manual override, not genuine promotion, mirroring
      SOCCER''s 2026-08-02 override. The active tennis-surface-elo-v1 model has
      never been run through this project''s walk-forward/locked-holdout pipeline
      (validation.py) -- no artifact file with a qualified/qualified_for_betting
      field exists for it, unlike every other shadow_qualified league. Gated
      Research and Main will now receive real, sized QUALIFIED_SHADOW_CALL rows
      whenever a contract clears min_edge, same criterion as before.
      _row_artifact_qualified (cli.py) fails closed for this override (no
      matchable artifact => False), so PolymarketExecutor.execute still refuses
      real execution on these rows without --manual-research-order -- this
      override changes what gets logged/sized, not what can actually be traded
      unattended.

      Update 2026-08-03: "same criterion as before" above is now stale --
      validation.qualify_tennis_elo_model ran for the first time this
      session (same chronological 60/20/20 split, learned-threshold
      methodology as soccer above): qualified true, 65.5% hit rate on 4269
      locked-holdout calls, +1070.7 units at -110, every qualifying month
      positive -- the strongest result of any sport checked this session.
      Operator approved wiring research_confidence_gate below from that
      real result.'
    active_research_version: tennis-surface-elo-v1
    min_edge: 0.05
    research_confidence_gate: 0.037239
    note: WTA and ATP moneyline (ATP added 2026-08-03) -- ESPN has no ITF scoreboard.
  LOL:
    family: neutral_series_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Esports v6 artifacts use Platt-scaled Elo; qualification
      gate is not applicable to esports match-winner markets.
    active_production_version: lol-tiered-elo-v6
    production_artifact: config/models/lol-tiered-elo-v6.json
    market_target: esports_match_winner
    min_edge: 0.025
    # v5 (2026-07-31): re-validated with K/threshold selected by proper
    # scoring rules instead of a raw flat-stake P&L proxy (v4's K=96 override
    # sat at the exact top of its search grid for 4 of 5 titles -- a classic
    # truncated-search/overfitting signal). K is now chosen by min Brier
    # (a pure calibration parameter, no volume/quality tradeoff, so a proper
    # scoring rule is the principled choice); confidence_threshold is still
    # chosen by units_at_minus_110 deliberately -- Brier was tried there too
    # and found structurally wrong for this decision (it improves almost
    # monotonically toward the single most restrictive threshold with no
    # interior optimum, unlike units_at_minus_110 which found a genuine
    # interior optimum ~0.03-0.05 for every title).
    # v6 (2026-08-04): added inactivity decay + thin-data confidence
    # discount at prediction time (NeutralElo.probability(); see
    # esports.py's INACTIVITY_*/THIN_DATA_* constants and MASTER.md F-63) --
    # addresses the documented "largest, least-trustworthy edges" gap.
    # Directly verified: mean predicted edge for thin-data matchups (either
    # side under 10 recorded games) dropped ~33% (0.095->0.064) on this
    # title's own locked test. Honest trade-off: locked-test accuracy/Brier
    # moved slightly worse in most titles (this one: 70.6%->69.2%,
    # 0.2014->0.2059) -- expected, since deliberately shrinking confidence
    # on genuinely uncertain matchups costs some accuracy on the ones that
    # turn out correct anyway, not just the overconfident misses. This
    # value matches this artifact's own re-validated confidence_threshold.
    research_confidence_gate: 0.03
  CS2:
    family: neutral_series_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Esports v6 artifacts use Platt-scaled Elo; qualification
      gate is not applicable to esports match-winner markets.
    active_production_version: cs2-tiered-elo-v6
    production_artifact: config/models/cs2-tiered-elo-v6.json
    market_target: esports_match_winner
    min_edge: 0.025
    # v6 (2026-08-04) -- see LOL's comment above for the full rationale.
    # This title's own locked-test numbers actually improved slightly
    # (65.8%->66.0% accuracy) despite the same thin-data edge reduction
    # (~35%, 0.112->0.073) -- not every title showed the accuracy trade-off.
    # Value matches this artifact's own re-validated confidence_threshold.
    research_confidence_gate: 0.03
  DOTA2:
    family: neutral_series_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Esports v6 artifacts use Platt-scaled Elo; qualification
      gate is not applicable to esports match-winner markets.
    active_production_version: dota2-tiered-elo-v6
    production_artifact: config/models/dota2-tiered-elo-v6.json
    market_target: esports_match_winner
    min_edge: 0.025
    # v6 (2026-08-04) -- see LOL's comment above for the full rationale.
    # This title showed the largest locked-test accuracy trade-off
    # (68.1%->64.8%) of the five -- flagged here rather than smoothed over;
    # the thin-data edge reduction (~33%, 0.102->0.068) is still real.
    # Value matches this artifact's own re-validated confidence_threshold
    # (re-run search found 0.0 -- essentially no confidence floor -- for
    # this title under the new decay/shrink regime).
    research_confidence_gate: 0.0
  VALORANT:
    family: neutral_series_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Esports v6 artifacts use Platt-scaled Elo; qualification
      gate is not applicable to esports match-winner markets.
    active_production_version: valorant-tiered-elo-v6
    production_artifact: config/models/valorant-tiered-elo-v6.json
    market_target: esports_match_winner
    min_edge: 0.025
    # v6 (2026-08-04) -- see LOL's comment above for the full rationale.
    # Value matches this artifact's own re-validated confidence_threshold
    # (re-run search found 0.0 for this title under the new decay/shrink
    # regime, down from v5's 0.03).
    research_confidence_gate: 0.0
  RAINBOW_SIX:
    family: neutral_series_elo
    status: research
    origin: statistical_model
    active_research_version: rainbow_six-tiered-elo-v6
    market_target: esports_match_winner
    min_edge: 0.025
    # v6 (2026-08-04) -- see LOL's comment above for the full rationale.
    # Value matches this artifact's own re-validated confidence_threshold
    # (re-run search found 0.0 for this title under the new decay/shrink
    # regime, down from v5's 0.03). Without this key, the code's own
    # default (0.05) would silently apply instead of this title's real
    # validated value.
    research_confidence_gate: 0.03
    note: New 2026-07-27. Unlike LOL/CS2/DOTA2/VALORANT, not yet promoted to
      shadow_qualified via qualification_override -- that was a deliberate
      per-title operator review this title hasn't had yet.
  KBO:
    family: tie_aware_home_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Tie-aware Elo model; standard moneyline qualification
      gate does not apply to tie-paying-half settlement. v2 adds margin-weighted K,
      recency decay, and game-specific tie probability.
    active_research_version: kbo-tie-aware-elo-v2
    research_artifact: config/models/kbo-tie-aware-elo-v2.json
    market_target: expected_moneyline_settlement_tie_pays_half
    research_outputs_zero_units: true
    active_production_version: kbo-tie-aware-elo-v2
    production_artifact: config/models/kbo-tie-aware-elo-v2.json
    # Honest disclosure (2026-08-03): international_baseball.py's new
    # confidence-threshold sweep learned 0.123889 on the validation split
    # (65% hit rate there) but did NOT generalize to the locked holdout --
    # 55.4% hit rate on 65 calls, qualified=false. Set anyway for
    # structural consistency with every other Gated Research sport
    # (operator decision, 2026-08-03), not because the evidence supports
    # it as real curation. Revisit if/when more KBO history accumulates.
    research_confidence_gate: 0.123889
  NPB:
    family: tie_aware_home_elo
    status: shadow_qualified
    origin: statistical_model
    qualification_override: true
    qualification_override_reason: Tie-aware Elo model; standard moneyline qualification
      gate does not apply to tie-paying-half settlement. v2 adds margin-weighted K (0.5),
      recency decay (0.002/day), and game-specific tie probability (elo_gap).
    active_research_version: npb-tie-aware-elo-v2
    research_artifact: config/models/npb-tie-aware-elo-v2.json
    market_target: expected_moneyline_settlement_tie_pays_half
    research_outputs_zero_units: true
    active_production_version: npb-tie-aware-elo-v2
    production_artifact: config/models/npb-tie-aware-elo-v2.json
    # Honest disclosure (2026-08-03): same story as KBO above -- learned
    # 0.090624 on validation (65% hit rate there), did NOT generalize to
    # the locked holdout (55.7% hit rate on 176 calls, qualified=false,
    # one non-positive month). Set anyway for structural consistency
    # (operator decision, 2026-08-03), not because the evidence supports
    # it as real curation.
    research_confidence_gate: 0.090624
  market_residual:
    method: logistic_regression
    rolling_window_days: 90
    minimum_sample: 100
    artifact: config/models/market-residual-v1.json
  promotion:
    primary:
      locked_holdout_required: true
      minimum_selective_calls: 50
      minimum_hit_rate: 0.6
    secondary_reporting:
    - brier_score
    - calibration
    optional_diagnostics:
    - roi
    - polymarket_bid_ask_costs
phase_0:
  enabled: true
  baseline_identifiers:
  - BASELINE_BOOK_RAW
  - BASELINE_BOOK_NO_VIG
  - BASELINE_CONSENSUS_NO_VIG
